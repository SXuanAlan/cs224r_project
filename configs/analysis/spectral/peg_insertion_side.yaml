run:
  name: peg_insertion_side_spectral_analysis
  seed: 2

dataset:
  kind: maniskill
  path: data/maniskill/PegInsertionSide-v1/motionplanning/trajectory.state.pd_ee_delta_pose.physx_cpu.h5
  limit_demos: 300
  val_fraction: 0.1
  analysis_split: all

action:
  env_id: PegInsertionSide-v1
  obs_key: obs
  action_key: actions

chunking:
  horizon: 16
  stride: 1
  k_values: [2, 4, 8, 12, 16]

spectral:
  fft:
    enabled: true
  morlet:
    enabled: true
    num_scales: 16
    w0: 6.0

normalization:
  type: per_dim_minmax
  eps: 1.0e-8

outputs:
  log_dir: logs/analysis/spectral/peg_insertion_side
  metrics_dir: outputs/analysis/spectral/peg_insertion_side/metrics
  figures_dir: outputs/analysis/spectral/peg_insertion_side/figures
