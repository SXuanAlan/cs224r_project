run:
  name: lift_ph_frequency_diagnostic
  seed: 0

dataset:
  path: robomimic/datasets/lift/ph/low_dim_v15.hdf5
  limit_demos: null
  val_fraction: 0.1
  analysis_split: all   # one of: all, train, val

action:
  source: auto           # auto, action_dict, legacy
  action_dict_keys:
    - rel_pos
    - rel_rot_6d
    - gripper
  legacy_key: actions

chunking:
  horizon: 16
  stride: 1
  k_values: [2, 4, 8, 12, 16]

transition:
  gripper_dim: auto
  threshold: auto
  binary_delta_threshold: 1.0
  percentile: 95

normalization:
  type: per_dim_minmax
  eps: 1.0e-8

outputs:
  log_dir: logs/analysis/frequency_diagnostic
  metrics_dir: outputs/analysis/frequency_diagnostic/metrics
  figures_dir: outputs/analysis/frequency_diagnostic/figures
