run:
  name: pusht_sparse_dct_stochastic_base_seed2
  seed: 2
dataset:
  path: data/pusht/pusht_cchi_v7_replay.zarr
  obs_key: state
  action_key: action
  env_obs_type: state
  limit_demos: null
  val_fraction: 0.1
chunking:
  horizon: 16
  observation_horizon: 2
  stride: 1
target:
  type: sparse_dct_anchored_residual
  dct_k: null
  base_target_type: dct_sparse
  base_sparse_k: 12
  base_checkpoint: outputs/train/sparse_dct_k812_seed2/pusht/k12/checkpoints/pusht_fm_dct_sparse_k12_seed2_canonical_20260602_022022/best.pt
  base_success_rate: 0.84
  base_noise_mode: normal
  base_num_flow_steps: 32
  residual_lambda: 0.25
  gate:
    mode: softmask
    init_logit: -2.0
    temperature: 1.0
    sparsity_weight: 0.001
    reconstruction_weight: 0.1
normalization:
  action:
    type: per_dim_minmax
    eps: 1.0e-08
  obs:
    type: per_dim_zscore
    eps: 1.0e-08
model:
  type: temporal_unet
  base_dim: 128
  dim_mults:
  - 1
  - 2
  - 4
  time_embed_dim: 128
  cond_dim: 256
  kernel_size: 5
  groups: 8
  dropout: 0.0
training:
  device: cuda
  epochs: 300
  batch_size: 256
  lr: 0.0001
  weight_decay: 1.0e-06
  num_workers: 0
  max_train_steps_per_epoch: 80
  eval_every_epochs: 10
  grad_clip_norm: 1.0
  ema:
    enabled: true
    decay: 0.995
  lr_scheduler:
    type: cosine
    warmup_steps: 500
    min_lr_scale: 0.05
sampling:
  num_flow_steps: 32
  clip_normalized_actions: true
eval_video:
  enabled: false
  num_examples: 4
  fps: 4
  log_to_wandb: true
simulation_video:
  enabled: false
  seed: 2
  n_rollouts: 50
  horizon: 300
  action_exec_horizon: 8
  fps: 20
  video_skip: 2
  success_reward_threshold: 0.95
  max_videos: 0
wandb:
  enabled: false
  project: cs224r-fgac
  entity: null
  mode: online
  tags:
  - pusht
  - sparse_dct_anchored_residual
  - seed2
  - base_k12
outputs:
  log_dir: logs/train/sparse_dct_stochastic_base_residual_seed2/pusht
  checkpoints_dir: outputs/train/sparse_dct_stochastic_base_residual_seed2/pusht/checkpoints
  metrics_dir: outputs/train/sparse_dct_stochastic_base_residual_seed2/pusht/metrics
  videos_dir: outputs/train/sparse_dct_stochastic_base_residual_seed2/pusht/videos
