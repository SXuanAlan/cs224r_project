run:
  name: pusht_fm_dct_fullfreq
  seed: 0

dataset:
  path: data/pusht/pusht_cchi_v7_replay.zarr
  obs_key: state
  action_key: action
  env_obs_type: state
  limit_demos: null
  val_fraction: 0.1

chunking:
  horizon: 16
  observation_horizon: 2
  stride: 1

target:
  type: dct_fullfreq
  dct_k: null

normalization:
  action:
    type: per_dim_minmax
    eps: 1.0e-8
  obs:
    type: per_dim_zscore
    eps: 1.0e-8

model:
  type: temporal_unet
  base_dim: 128
  dim_mults: [1, 2, 4]
  time_embed_dim: 128
  cond_dim: 256
  kernel_size: 5
  groups: 8
  dropout: 0.0

training:
  device: cuda
  epochs: 1000
  batch_size: 256
  lr: 1.0e-4
  weight_decay: 1.0e-6
  num_workers: 0
  max_train_steps_per_epoch: null
  eval_every_epochs: 10
  grad_clip_norm: 1.0
  ema:
    enabled: true
    decay: 0.995
  lr_scheduler:
    type: cosine
    warmup_steps: 500
    min_lr_scale: 0.05

sampling:
  num_flow_steps: 32
  clip_normalized_actions: true

simulation_video:
  enabled: false
  seed: 0
  n_rollouts: 50
  horizon: 300
  action_exec_horizon: 8
  fps: 20
  video_skip: 2
  success_reward_threshold: 0.95

wandb:
  enabled: false
  project: cs224r-fgac
  entity: null
  mode: online
  tags: [milestone, pusht, flow_matching, dct_fullfreq]

outputs:
  log_dir: logs/train/pusht_dct_fullfreq
  checkpoints_dir: outputs/train/pusht_dct_fullfreq/checkpoints
  metrics_dir: outputs/train/pusht_dct_fullfreq/metrics
  videos_dir: outputs/train/pusht_dct_fullfreq/videos
