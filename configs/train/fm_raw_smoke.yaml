run:
  name: lift_ph_fm_raw_smoke
  seed: 0

dataset:
  path: robomimic/datasets/lift/ph/low_dim_v15.hdf5
  limit_demos: 8
  val_fraction: 0.25
  obs_keys:
    - object
    - robot0_eef_pos
    - robot0_eef_quat
    - robot0_gripper_qpos

action:
  source: auto
  action_dict_keys:
    - rel_pos
    - rel_rot_6d
    - gripper
  legacy_key: actions

chunking:
  horizon: 16
  observation_horizon: 2
  stride: 4

target:
  type: raw
  dct_k: null

normalization:
  action:
    type: per_dim_minmax
    eps: 1.0e-8
  obs:
    type: per_dim_zscore
    eps: 1.0e-8

model:
  type: temporal_unet
  base_dim: 32
  dim_mults: [1, 2]
  time_embed_dim: 64
  cond_dim: 128
  kernel_size: 5
  groups: 8
  dropout: 0.0

training:
  device: cuda
  epochs: 1
  batch_size: 32
  lr: 1.0e-4
  weight_decay: 1.0e-6
  num_workers: 0
  max_train_steps_per_epoch: 2
  eval_every_epochs: 1
  grad_clip_norm: 1.0
  ema:
    enabled: true
    decay: 0.995
  lr_scheduler:
    type: cosine
    warmup_steps: 2
    min_lr_scale: 0.05

sampling:
  num_flow_steps: 2
  clip_normalized_actions: true

eval_video:
  enabled: false
  num_examples: 4
  fps: 4
  log_to_wandb: false

simulation_video:
  enabled: false
  n_rollouts: 1
  horizon: 40
  action_exec_horizon: 8
  camera_names: [agentview]
  height: 128
  width: 128
  fps: 20
  video_skip: 4

wandb:
  enabled: false
  project: cs224r-fgac
  entity: null
  mode: disabled
  tags: [smoke, flow_matching, raw]

outputs:
  log_dir: logs/train/smoke
  checkpoints_dir: outputs/train/smoke/checkpoints
  metrics_dir: outputs/train/smoke/metrics
  videos_dir: outputs/train/smoke/videos
